<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách user</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: black;
            text-align: center;
            transition: background 0.3s, color 0.3s;
        }
        .dark-mode {
            background-color: #1e3a8a;
            color: white;
        }
        header, footer {
            background: #007bff;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav {
            display: flex;
            gap: 15px;
        }
        nav a {
            color: white;
            text-decoration: none;
        }
        .right-section {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        #toggle-bg {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: white;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        table {
            width: 80%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0px 0px 10px gray;
            border-radius: 10px;
            overflow: hidden;
        }
        .dark-mode table {
            background: #1e40af;
            color: white;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }
        th {
            background: #007bff;
            color: white;
        }
        .dark-mode th {
            background: #0056b3;
        }
        .pagination {
            margin-top: 15px;
        }
        .pagination a {
            padding: 8px 12px;
            margin: 0 5px;
            text-decoration: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
        }
        .pagination a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
        </nav>
        <div class="right-section">
            <a href="logout.html" style="color: white; text-decoration: none;">Đăng xuất</a>
            <button id="toggle-bg">🌙</button>
        </div>
    </header>
    
    <div class="container">
        <h3>Danh sách user</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>UPVH</td>
                    <td>ATJW@gmail.com</td>
                    <td><a href="#">Edit</a> | <a href="#">View</a> | <a href="#">Delete</a></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>IFUK</td>
                    <td>KULB@gmail.com</td>
                    <td><a href="#">Edit</a> | <a href="#">View</a> | <a href="#">Delete</a></td>
                </tr>
                <!-- Add more users as needed -->
            </tbody>
        </table>
        <div class="pagination">
            <a href="#">Previous</a>
            <a href="#">1</a>
            <a href="#">2</a>
            <a href="#">3</a>
            <a href="#">Next</a>
        </div>
    </div>
    
    <footer>
        <p>Lập trình web @01/2024</p>
    </footer>

    <script>
        document.getElementById('toggle-bg').addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            this.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
