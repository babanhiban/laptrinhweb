<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách người dùng</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: black;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            background: #007bff;
            padding: 10px 20px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .user-list-container {
            width: 80%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #007bff;
            color: white;
        }
        .pagination {
            text-align: center;
            margin-top: 10px;
        }
        .pagination a {
            padding: 5px 10px;
            margin: 0 5px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .pagination a:hover {
            background: #0056b3;
        }
        .btn {
            padding: 5px 10px;
            margin: 2px;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-edit {
            background: #28a745;
        }
        .btn-view {
            background: #17a2b8;
        }
        .btn-delete {
            background: #dc3545;
        }
        .btn:hover {
            opacity: 0.8;
        }
        footer {
            text-align: center;
            padding: 10px;
            background: #007bff;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">Đăng xuất</a>
    </div>
    
    <div class="user-list-container">
        <h2>Danh sách user</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>UPVH</td>
                    <td>ATJW@gmail.com</td>
                    <td>
                        <button class="btn btn-edit">Edit</button>
                        <button class="btn btn-view">View</button>
                        <button class="btn btn-delete">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>IFUK</td>
                    <td>KULB@gmail.com</td>
                    <td>
                        <button class="btn btn-edit">Edit</button>
                        <button class="btn btn-view">View</button>
                        <button class="btn btn-delete">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>DZZQ</td>
                    <td>ERNB@gmail.com</td>
                    <td>
                        <button class="btn btn-edit">Edit</button>
                        <button class="btn btn-view">View</button>
                        <button class="btn btn-delete">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>NJYY</td>
                    <td>ROIF@gmail.com</td>
                    <td>
                        <button class="btn btn-edit">Edit</button>
                        <button class="btn btn-view">View</button>
                        <button class="btn btn-delete">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div class="pagination">
            <a href="#">Previous</a>
            <a href="#">1</a>
            <a href="#">2</a>
            <a href="#">3</a>
            <a href="#">Next</a>
        </div>
    </div>
    
    <footer>
        <p>Lập trình web @01/2024</p>
    </footer>
</body>
</html>
